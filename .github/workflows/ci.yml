name: CI/CD ConexiónLocal

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend:
        name: Backend — Lint, Test & Build
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: conexion_local_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DB_NAME: conexion_local_test
            DB_USER: postgres
            DB_PASSWORD: postgres
            DB_HOST: localhost
            DB_DIALECT: postgres
            JWT_SECRET: secret_test_ci

        steps:
            - name: Checkout código
              uses: actions/checkout@v4

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: Instalar dependencias del backend
              working-directory: backend
              run: npm install

            - name: Lint del backend
              working-directory: backend
              run: npm run lint

            - name: Pruebas del backend con cobertura
              working-directory: backend
              run: npm test -- --coverage

    frontend:
        name: Frontend — Lint & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout código
              uses: actions/checkout@v4

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: Instalar dependencias del frontend
              working-directory: frontend
              run: npm install

            - name: Lint del frontend
              working-directory: frontend
              run: npm run lint

            - name: Build del frontend
              working-directory: frontend
              run: npm run build
